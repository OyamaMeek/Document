[custom]
; HappaConfig：用于生成 Surge 4 配置的 Subconverter 外部模板
; 使用时将本文件地址填入订阅转换工具的 config / 远程配置字段。
; target=surge&ver=4；订阅链接通过 url 参数传入，文件名可设为 HappaConfig。
; url 与 config 参数均需进行 URL 编码。
; 官方格式说明：https://github.com/tindy2013/subconverter/blob/master/base/config/example_external_config.ini

; 基础模板保存通用参数、Host、MITM 参数、脚本与全部 Surge 原生规则。
surge_rule_base=https://raw.githubusercontent.com/OyamaMeek/Codex-Work/main/HappaConfig.conf
; 保留基础模板中的规则及顺序，包括 AND、DOMAIN-SET 和 FINAL 的 dns-failed 参数。
enable_rule_generator=false
overwrite_original_rules=false
; 保留订阅原有节点名称和 Emoji，便于地区正则按名称筛选。
add_emoji=false
remove_old_emoji=false

; 分组格式：分组名`select`成员；[] 前缀直接引用策略或其他分组。
; 不带 [] 的成员是节点名称正则；.* 导入此次转换得到的全部节点。
; select 首位成员为初始默认项；Surge 已保存的手动选择会继续保留。
; 指定节点先按精确名称导入，再补充其余节点；订阅没有该节点时使用下一匹配项。
; 英文分组名称用于规则引用，说明保持中文。
; 通用出站入口
custom_proxy_group=Proxy`select`[]Manual`[]HK`[]JP`[]SG`[]US`[]TW`[]International`[]DIRECT
; 手动选择此次转换输入的全部节点，无固定订阅地址
custom_proxy_group=Manual`select`^🇯🇵 JP-GreenCloud-3$`.*
; 展示此次转换得到的全部节点
custom_proxy_group=All Proxies`select`^🇯🇵 JP-zgo-2$`.*
; Emby 流量单独选择出口
custom_proxy_group=Emby`select`[]DIRECT`[]HK`[]JP`[]US`[]SG`[]Manual
; YouTube 与其他国际媒体共用此组
custom_proxy_group=Global Media`select`[]Proxy`[]HK`[]JP`[]US`[]SG`[]TW`[]International`[]Manual
; Netflix、TikTok、Disney 分别选择出口
custom_proxy_group=Netflix`select`[]Manual`[]HK`[]JP`[]TW`[]US`[]SG`[]International
custom_proxy_group=TikTok`select`[]Manual`[]JP`[]TW`[]HK`[]US`[]SG`[]International
custom_proxy_group=Disney`select`[]Manual`[]HK`[]JP`[]TW`[]US`[]SG`[]International
; Telegram、Twitter、WhatsApp 共用的社交流量组
custom_proxy_group=Social Media`select`[]Manual`[]HK`[]JP`[]US`[]SG`[]TW`[]International`[]Proxy
; Spotify 音乐流量
custom_proxy_group=Spotify`select`[]HK`[]JP`[]TW`[]US`[]SG`[]International`[]Manual
; OpenAI 服务
custom_proxy_group=OpenAI`select`[]Manual`[]US
; Apple 服务，可选直连
custom_proxy_group=Apple`select`[]DIRECT`[]HK`[]US`[]JP`[]SG`[]TW`[]International`[]Proxy`[]Manual
; GitHub、GitLab、Google 与其他全球网站
custom_proxy_group=Global`select`[]Manual`[]HK`[]JP`[]US`[]SG`[]TW`[]International`[]Proxy
; Google Voice 单独选择出口
custom_proxy_group=Google Voice`select`[]US`[]HK`[]JP`[]SG`[]TW`[]International`[]Manual
; 测速网站，可选直连或某个代理
custom_proxy_group=SpeedTest`select`[]Manual`[]DIRECT`[]HK`[]JP`[]SG`[]US`[]TW`[]International
; 国内网站与视频服务
custom_proxy_group=China`select`[]DIRECT`[]HK`[]TW`[]Proxy`[]Manual
; 未命中前面规则的兜底组
custom_proxy_group=Final`select`[]Proxy`[]DIRECT`[]HK`[]Manual
; 地区归类沿用原配置的节点名称筛选，名称变化会影响匹配结果。
; 某组无匹配节点时，Subconverter 会使用 DIRECT 作为该组的内容。
custom_proxy_group=HK`select`(?=.*(港|HK|🇭🇰|(?i)Hong))^((?!(WARP|台|日|韩|新|美)).)*$
custom_proxy_group=JP`select`^🇯🇵 JP-GreenCloud-3$`(?=.*(日|JP|🇯🇵|(?i)Japan))^((?!(WARP|港|台|韩|新|狮|美|利亚)).)*$
custom_proxy_group=TW`select`(?=.*(台|TW|(?i)Taiwan))^((?!(WARP|港|日|韩|新|美)).)*$
custom_proxy_group=SG`select`(?=.*(新|狮|獅|SG|🇸🇬|(?i)Singapore))^((?!(WARP|港|台|日|韩|美)).)*$
custom_proxy_group=US`select`^🇺🇸 US-DMIT-3$`(?=.*(美|US|🇺🇸|(?i)States|American))^((?!(WARP|港|台|日|韩|新)).)*$
; 名称不含下方排除标记的其他国际节点
custom_proxy_group=International`select`^🇬🇧 UK-GreenCloud-3$`(?=.*)^((?!(WARP|港|HK|日|JP|台|TW|新|SG|美|US|🇨🇳|🇭🇰|🇺🇸|🇯🇵|🏳️‍🌈|🇸🇬)).)*$

[template]
; 仅 Surge Mac：WeChat 直接 IPv6 地址请求走 Proxy，绕过当前直连路径故障。
; 域名解析到 IPv6 的请求不由此规则保证匹配。
; 基础模板在 Rule 节首位引用此变量，转换后生成完整规则。
wechat_ipv6_rule=AND,((PROCESS-NAME,WeChat),(HOSTNAME-TYPE,IPv6)),Proxy
