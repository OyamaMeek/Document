[Host]
# 本地 DNS 映射：固定 IP 直接返回地址，超星资源按 INI 指定 DNS，其余使用统一 DoT
# 这些记录影响本地解析；代理端解析通常使用原始域名
# 参考：https://manual.nssurge.com/dns/local-dns-mapping.html
{{ local.chaoxing_dns_host }}
# > Firebase Cloud Messaging
# 固定推送服务地址，避免本地解析结果改变
mtalk.google.com = 108.177.125.188

[MITM]
# HTTPS 解密配置；需系统信任此 CA，并通过 hostname 指定解密主机
# 参考：https://manual.nssurge.com/http/mitm.html
# 解密时跳过远端服务器证书校验；客户端仍会收到 Surge 生成的证书
skip-server-cert-verify = true
# 允许对匹配 hostname 的原始 TCP 连接进行 HTTPS 解密
tcp-connection = true
# 允许使用 HTTP/2 进行 MITM 解密
h2 = true
# 需要 HTTPS 解密时，在 Surge 内生成或导入自己的 CA 证书并信任。
# 共享模板不携带 CA 私钥和证书密码。

[Script]
# 仅无 # 前缀的“每日一言”已启用，其余均为未启用的脚本示例
# type=cron 按 cronexp 定时运行；script-path 指定脚本来源
# cronexp 五个字段依次为分、时、日、月、星期；六个字段在最前面增加秒
# 示例中的 http-request / http-response 分别在匹配请求 / 响应时运行
# 参考：https://manual.nssurge.com/scripting/cron.html
