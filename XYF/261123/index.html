<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>机械基础 · 每日打卡</title>
<meta name="description" content="机械基础每日练习：14 道机构自由度计算、46 个材料牌号，配有即时解析、错题本与学习记录。">
<meta name="apple-mobile-web-app-title" content="机械打卡">
<link rel="icon" type="image/png" href="tubiao.PNG">
<link rel="apple-touch-icon" href="tubiao.PNG">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f7;--card:#fff;--ink:#20262e;--ink2:#35404e;--mute:#606b79;
  --soft:#f0f3f6;--soft2:#e4e9ef;--accent:#1762cf;--accent-hover:#124fa8;
  --accent-soft:#e9f0fc;--success:#246d4e;--success-soft:#eaf5ef;
  --error:#a53630;--error-soft:#fbeeed;--white:#fff;--scrim:rgba(21,29,40,.42);
  --radius:1.5rem;--ease:cubic-bezier(.2,.8,.2,1);
  font:100%/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-optical-sizing:auto;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:0 0 3rem 12.5rem}
body.modal-open{overflow:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.25;letter-spacing:-.035em}
h1{font-size:clamp(2rem,3.2vw,2.75rem);font-weight:750}
h2{font-size:1.25rem;font-weight:700}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
button,a,input{outline-offset:4px}
:focus-visible{outline:3px solid var(--accent)}
button{transition:transform .18s var(--ease),opacity .18s var(--ease)}
button:not(:disabled):active{transform:scale(.97);transition-duration:70ms}
button:disabled{cursor:default}
a{color:var(--accent)}
::selection{background:var(--accent-soft);color:var(--ink)}
.wrap{width:100%;max-width:1256px;margin:0 auto;padding:0 2.5rem}
.mono{font-variant-numeric:tabular-nums}
.skip{position:fixed;top:.5rem;left:1rem;z-index:60;transform:translateY(-160%);background:var(--card);padding:.75rem 1rem;border-radius:2rem}
.skip:focus{transform:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
header.top{padding:3rem 0 1.5rem}
.heading-row{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.page-description{font-size:1rem;margin-top:.5rem;color:var(--mute)}
.day-count{font-size:1rem;font-weight:650;white-space:nowrap;background:var(--card);padding:.65rem 1rem;border-radius:2rem}
.day-count strong{font-size:1.5rem;letter-spacing:-.04em;margin:0 .2rem;font-variant-numeric:tabular-nums}
.overview{margin-top:1.75rem;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2rem;background:var(--card);padding:1.25rem 1.5rem;border-radius:var(--radius)}
.progress-caption{display:flex;align-items:center;gap:.75rem;font-size:.875rem;white-space:nowrap}
.progress-caption b{font-size:1.125rem;font-variant-numeric:tabular-nums}
.progress-caption span{color:var(--mute)}
.dots{display:flex;gap:.375rem}
.dots i{flex:1;height:.5rem;background:var(--soft2);border-radius:1rem}
.dots i.done{background:var(--accent)}
.dots i.now{background:var(--accent);opacity:.4}
.study-grid{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,1fr);gap:1.5rem;align-items:start}
.card{background:var(--card);border-radius:var(--radius);padding:1.75rem;margin-bottom:1.25rem;min-width:0}
.study-grid .card{margin:0}
#mqCard{position:sticky;top:1.5rem}
.tag{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
.tag .cnt{font-size:.8125rem;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.svgwrap{background:var(--soft);border-radius:1rem;padding:1.5rem .75rem;margin-bottom:1.25rem}
svg{display:block;width:100%;height:auto}
.svgwrap svg{max-height:220px}
.qtext{font-size:1rem;line-height:1.8}
.qtext b{font-weight:650}
.hint{font-size:.875rem;color:var(--mute);margin-top:.75rem}
.blanks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.625rem;margin-top:1.5rem}
.blank{background:var(--soft);border-radius:.75rem;padding:.75rem 1rem}
.blank label{display:block;font-size:.8125rem;line-height:1.4;color:var(--ink2)}
.blank label i{font-style:normal;color:var(--mute);margin-left:.375rem}
.blank .r{display:flex;align-items:center;gap:.375rem;margin-top:.125rem}
.blank input{flex:1;width:0;min-width:0;height:44px;border:0;text-align:left;font-size:1.25rem;font-weight:650;background:transparent;padding:0;font-variant-numeric:tabular-nums;border-radius:.25rem}
.blank input::placeholder{color:var(--mute);font-weight:400}
.blank:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.blank .mk{flex:none;font-size:.75rem;font-weight:600}
.blank.ok{background:var(--success-soft)}
.blank.ok .mk{color:var(--success)}
.blank.no{background:var(--error-soft)}
.blank.no .mk{color:var(--error)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.75rem 1.25rem;border-radius:2rem;font-size:.9375rem;font-weight:600}
.btn.sub{width:100%;background:var(--accent);color:var(--white);margin-top:1.25rem}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sub:disabled,.navd:disabled,.navg:disabled{background:var(--soft);color:var(--mute)}
.sol{margin-top:1.5rem;display:none}
.sol.on{display:block}
.verdict{font-size:1rem;font-weight:650;margin-bottom:.75rem}
.verdict.ok{color:var(--success)}
.verdict.bad{color:var(--error)}
.formula{font-size:.875rem;background:var(--soft);padding:1rem;border-radius:.75rem;margin-bottom:1rem;line-height:1.9;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.formula b{display:block;font-weight:500}
.steps{padding-left:1.25rem;margin:0;font-size:.9375rem;line-height:1.8}
.steps li+li{margin-top:.5rem}
.tipbox{margin-top:1rem;font-size:.875rem;color:var(--mute)}
.qbar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.25rem;margin:-.25rem -.25rem .5rem}
.qbar button{height:44px;min-width:0;padding:0;font-size:.8125rem;border-radius:.625rem;background:var(--soft);font-variant-numeric:tabular-nums}
.qbar button.ok{color:var(--success);background:var(--success-soft)}
.qbar button.no{color:var(--error);background:var(--error-soft)}
.qbar button.cur{background:var(--ink);color:var(--white)}
.qnote{font-size:.8125rem;color:var(--mute);margin:.75rem 0 1.5rem}
.stem{font-size:1.125rem;line-height:1.8;font-weight:550;min-height:5rem}
.stem .txt .g{font-weight:750}
.opts{margin:1.25rem 0 0;display:flex;flex-direction:column;gap:.625rem}
.opt{text-align:left;background:var(--soft);border-radius:1rem;padding:1rem;font-size:1rem;line-height:1.6;display:flex;gap:.75rem;align-items:flex-start;min-height:56px;width:100%}
.opt .lb{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--card);color:var(--ink2);font-size:.8125rem;font-weight:650;display:flex;align-items:center;justify-content:center;margin-top:.0625rem}
.opt .mk{margin-left:auto;font-size:.8125rem;font-weight:600;flex:none;white-space:nowrap}
.opt.ok{color:var(--success);background:var(--success-soft)}
.opt.ok .lb{background:var(--success);color:var(--white)}
.opt.no{color:var(--error);background:var(--error-soft)}
.opt.no .lb{background:var(--error);color:var(--white)}
.opt.dim{color:var(--mute)}
.fb{margin:1rem 0 0;font-size:.9375rem;line-height:1.8;padding:1rem;display:none;background:var(--success-soft);border-radius:1rem}
.fb.on{display:block}
.fb.no{background:var(--error-soft)}
.fb .hd{font-weight:650}
.fb .why{display:block;margin-top:.375rem}
.mnav{display:flex;gap:.75rem;margin-top:1.25rem}
.mnav button{flex:1;min-height:48px;border-radius:2rem;font-size:.9375rem;font-weight:600;padding:.625rem}
.navg{background:var(--soft)}
.navd{background:var(--ink);color:var(--white)}
.finish{margin:1.5rem 0 0;padding:1.25rem;background:var(--soft);border-radius:1rem}
.finish .btn{margin-top:0}
.finish .btn:disabled{background:var(--soft2)}
.goalline{text-align:center;font-size:.8125rem;color:var(--mute);margin-top:.75rem}
.done-card{max-width:640px;padding:3rem;margin:1rem auto}
.done-card .big{font-size:1.75rem;font-weight:700;letter-spacing:-.035em}
.done-card p{margin-top:1rem}
.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
.actions .btn{flex:1;margin:0}
nav{position:fixed;inset:0 auto 0 0;width:12.5rem;z-index:20;background:var(--card);padding:2.5rem 1rem;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:.625rem;padding:0 .75rem;font-size:1.125rem;font-weight:750;letter-spacing:-.04em}
.brand svg{width:28px;height:28px;color:var(--ink)}
.brand-note{font-size:.8125rem;color:var(--mute);margin:.5rem .75rem 2.5rem}
nav .inner{display:flex;flex-direction:column;gap:.5rem}
nav button{display:flex;align-items:center;gap:.875rem;min-height:48px;padding:.875rem 1rem;text-align:left;font-size:.9375rem;color:var(--mute);border-radius:.875rem}
nav .ico{width:20px;height:20px;flex:none;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav-note{font-size:.8125rem;color:var(--mute);margin:auto .75rem 0;padding-top:2rem;line-height:1.8}
.sec-title{font-size:1.125rem;font-weight:650;margin:1.75rem 0 1rem;letter-spacing:-.02em}
.sec-title:first-child{margin-top:0}
.search-panel{margin-bottom:2rem}
.search-label{display:block;font-weight:600;margin-bottom:.75rem}
.search{width:100%;height:56px;border:0;border-radius:1rem;background:var(--card);padding:0 1.25rem;font-size:1rem}
.search-meta{font-size:.875rem;color:var(--mute);margin-top:.75rem}
.lib-item{padding:1.25rem 1rem;display:grid;grid-template-columns:minmax(120px,1fr) 3fr;gap:1.5rem;border-radius:.75rem}
.lib-item:nth-child(even){background:var(--soft)}
.lib-item .grade{font-size:1.125rem;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.lib-item .grade span{display:block;font-size:.8125rem;font-weight:400;color:var(--mute);margin-top:.375rem}
.lib-item .m{font-size:1rem}
.lib-item .u{font-size:.875rem;color:var(--mute);margin-top:.375rem}
.empty{background:var(--card);border-radius:var(--radius);padding:3rem 1.5rem;text-align:center;color:var(--mute);font-size:1rem;line-height:1.9}
.empty h2{color:var(--ink);margin-bottom:.75rem}
.empty .btn{margin-top:1.5rem;color:var(--ink)}
.wq{padding:1.25rem;border-radius:1rem;background:var(--soft)}
.wq+.wq{margin-top:1rem}
.wq .s{font-size:1rem;font-weight:600;padding-right:4rem}
.wq .a{font-size:.9375rem;color:var(--ink2);margin-top:.75rem;line-height:1.9;overflow-wrap:anywhere}
.wq .a em{font-style:normal;color:var(--success);font-weight:650}
.wq .del{float:right;min-height:44px;min-width:56px;color:var(--mute);font-size:.875rem;background:var(--card);border-radius:2rem;padding:.5rem .75rem}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.25rem;background:var(--card);border-radius:var(--radius);padding:2rem}
.stat .v{font-size:clamp(1.75rem,3vw,2.75rem);font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:.875rem;color:var(--mute);margin-top:.625rem}
.rec{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.9375rem;padding:1rem;border-radius:.75rem}
.rec:nth-child(even){background:var(--soft)}
.rec .sc{font-variant-numeric:tabular-nums;color:var(--mute)}
.note{font-size:.9375rem;color:var(--mute);line-height:1.9}
.notes p+p{margin-top:1rem}
.danger{color:var(--error)!important}
.page-footer{font-size:.8125rem;color:var(--mute);padding:2rem 0 0}
.mask{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:1.25rem;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s var(--ease)}
.mask.on{opacity:1;visibility:visible;pointer-events:auto}
.modal{background:var(--card);border-radius:1.75rem;padding:2rem;width:100%;max-width:400px;text-align:center;max-height:calc(100dvh - 2.5rem);overflow-y:auto}
.modal .mark{font-size:.9375rem;font-weight:650;color:var(--success);margin-bottom:1rem}
.modal h3{font-size:1.5rem}
.modal .score{font-size:4rem;font-weight:700;letter-spacing:-.05em;margin:1.25rem 0 .5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.modal .score span{font-size:1rem;color:var(--mute);font-weight:500;letter-spacing:0}
.modal p{font-size:.9375rem;color:var(--mute);margin-top:.75rem;line-height:1.8}
.modal .row{display:flex;gap:.75rem;margin-top:1.5rem}
.modal .row .btn{flex:1;margin:0}
@media(hover:hover){
  nav button:not(.on):hover,.btn.ghost:hover,.navg:not(:disabled):hover{background:var(--soft2)}
  .btn.sub:not(:disabled):hover{background:var(--accent-hover)}
  .opt:not(:disabled):hover,.qbar button:not(.cur):hover{background:var(--accent-soft)}
  .navd:not(:disabled):hover{opacity:.85}
}
@media(max-width:1100px){
  body{padding-left:10rem}
  nav{width:10rem;padding:2rem .625rem}
  nav button{padding:.875rem .75rem;gap:.625rem}
  .brand{font-size:1rem;padding:0 .5rem}
  .brand-note{margin-left:.5rem}
  .wrap{padding:0 1.5rem}
  .study-grid{grid-template-columns:1fr;max-width:720px;margin:0 auto}
  #mqCard{position:static}
  .svgwrap svg{max-height:260px}
}
@media(max-width:700px){
  body{padding:0 0 calc(6rem + env(safe-area-inset-bottom))}
  .wrap{padding:0 1rem}
  header.top{padding:calc(1.75rem + env(safe-area-inset-top)) 0 1.25rem}
  .heading-row{gap:.5rem}
  .page-description{font-size:.875rem;max-width:23rem}
  .day-count{padding:.5rem .75rem;font-size:.8125rem}
  .day-count strong{font-size:1.25rem}
  .overview{grid-template-columns:1fr;gap:.875rem;padding:1.125rem;margin-top:1.25rem;border-radius:1.25rem}
  .progress-caption{justify-content:space-between}
  .dots{gap:.25rem}
  .card{padding:1.25rem;border-radius:1.25rem}
  .study-grid{gap:1rem}
  .tag{gap:.5rem;margin-bottom:1.25rem;align-items:flex-start}
  .tag h2{font-size:1.125rem}
  .tag .cnt{padding-top:.125rem}
  .svgwrap{padding:1rem .5rem}
  .blank{padding:.625rem .75rem}
  .qbar{grid-template-columns:repeat(5,minmax(0,1fr));gap:.375rem;margin:0 0 .75rem}
  .stem{font-size:1.0625rem;min-height:0}
  .opt{padding:.875rem;gap:.625rem}
  .opt .mk{font-size:.75rem}
  .finish{padding:1rem}
  nav{inset:auto 0 0;width:100%;padding:.375rem max(.5rem,env(safe-area-inset-right)) calc(.375rem + env(safe-area-inset-bottom)) max(.5rem,env(safe-area-inset-left))}
  nav .inner{flex-direction:row;gap:.25rem;width:100%;max-width:520px;margin:0 auto}
  nav button{flex:1;min-width:0;min-height:60px;flex-direction:column;gap:.25rem;padding:.5rem .125rem;font-size:.8125rem;border-radius:.75rem}
  .brand,.brand-note,.nav-note{display:none}
  .lib-item{grid-template-columns:1fr;gap:.625rem;padding:1rem .75rem}
  .lib-item .grade{font-size:1.125rem}
  .lib-item .grade span{display:inline;font-size:.8125rem;margin-left:.75rem}
  .stat-grid{gap:.625rem;padding:1.5rem 1rem}
  .stat .k{font-size:.8125rem}
  .rec{padding:.75rem .25rem;gap:.375rem}
  .done-card{padding:2rem 1.25rem}
  .modal{padding:1.75rem 1.25rem}
  .modal h3{font-size:1.25rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  button:not(:disabled):active{transform:none}
}
@media(prefers-contrast:more){
  :root{--mute:#36414e;--soft:#e8ecf1;--soft2:#d1d9e3}
  .qbar button.cur{outline:2px solid var(--ink);outline-offset:2px}
}
</style>
</head>

<div class="wrap" id="app">

<nav aria-label="学习导航">

<div id="status" class="sr-only" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   机械基础（少学时）第3版 · 第二模块
   自由度题：填空式（构件总数 / 活动构件数 / 虚约束 / 局部自由度 /
             复合铰链 / 低副数 / 高副数 / 自由度）
   牌号题：46 个牌号，两种问法各占一半
   机构图保留教材黑白线稿
   ========================================================= */

/* ---------- 材料牌号库 ---------- */
const MAT = [
 {g:'Q215',c:'碳素结构钢',m:'屈服强度不低于 215 MPa 的碳素结构钢',u:'薄钢板、钢管、焊接结构件'},
 {g:'Q235',c:'碳素结构钢',m:'屈服强度不低于 235 MPa 的碳素结构钢',u:'建筑构件、螺钉螺母、冲压件（用量最大的普通碳素钢）'},
 {g:'Q275',c:'碳素结构钢',m:'屈服强度不低于 275 MPa 的碳素结构钢',u:'轴、齿轮毛坯、型钢'},
 {g:'Q345',c:'低合金高强度结构钢',m:'屈服强度不低于 345 MPa 的低合金高强度结构钢',u:'桥梁、车辆、压力容器、大型工程结构'},
 {g:'08F',c:'优质碳素结构钢',m:'平均碳质量分数 0.08% 的沸腾钢',u:'冲压件、深冲件（塑性好）'},

/* ---------- 黑白线稿绘图工具 ---------- */
const C={ink:'#141414',rod:'#1f1f1f',fill:'#f4f4f4',soft:'#eeeeee',ht:'#a0a0a0',white:'#fff'};
const rod=(x1,y1,x2,y2,w=6)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.rod}" stroke-width="${w}" stroke-linecap="round"/>`;
const jt=(x,y,label,dx=9,dy=-9)=>`<circle cx="${x}" cy="${y}" r="5.4" fill="#fff" stroke="${C.ink}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="1.5" fill="${C.ink}"/>`+
  (label?`<text x="${x+dx}" y="${y+dy}" font-size="13" font-weight="700" fill="${C.ink}">${label}</text>`:'');
const bigjt=(x,y,label,dx=9,dy=-10)=>`<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="${C.ink}" stroke-width="1.3"/>`+jt(x,y,label,dx,dy);
const gnd=(x1,x2,y)=>{let s=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${C.ink}" stroke-width="1.6"/>`;
  for(let x=x1+4;x<x2;x+=11){s+=`<line x1="${x}" y1="${y+9}" x2="${x+7}" y2="${y}" stroke="${C.ht}" stroke-width="1.1"/>`}return s};
const sup=(x,y,base=14)=>{let s=`<polygon points="${x},${y} ${x-9},${y+base} ${x+9},${y+base}" fill="none" stroke="${C.ink}" stroke-width="1.5"/>`;
  s+=`<line x1="${x-15}" y1="${y+base}" x2="${x+15}" y2="${y+base}" stroke="${C.ink}" stroke-width="1.6"/>`;
  for(let i=-13;i<13;i+=7){s+=`<line x1="${x+i}" y1="${y+base+8}" x2="${x+i+6}" y2="${y+base}" stroke="${C.ht}" stroke-width="1.1"/>`}return s};
const frame=(x,y,yb,bw=24)=>{let s=`<line x1="${x}" y1="${y}" x2="${x}" y2="${yb}" stroke="${C.ink}" stroke-width="1.4"/>`;
  s+=`<line x1="${x-bw}" y1="${yb}" x2="${x+bw}" y2="${yb}" stroke="${C.ink}" stroke-width="1.6"/>`;
  for(let i=-bw+3;i<bw;i+=8){s+=`<line x1="${x+i}" y1="${yb+8}" x2="${x+i+6}" y2="${yb}" stroke="${C.ht}" stroke-width="1.1"/>`}return s};
const hubfix=(x,y)=>{let s=`<polygon points="${x},${y} ${x-7},${y+13} ${x+7},${y+13}" fill="none" stroke="${C.ink}" stroke-width="1.3"/>`;
  s+=`<line x1="${x-11}" y1="${y+13}" x2="${x+11}" y2="${y+13}" stroke="${C.ink}" stroke-width="1.4"/>`;
  for(let i=-8;i<8;i+=5){s+=`<line x1="${x+i}" y1="${y+18}" x2="${x+i+5}" y2="${y+13}" stroke="${C.ht}" stroke-width="1"/>`}return s};
const slider=(cx,cy,w=38,h=24)=>{
  let s=`<rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="2" fill="#fff" stroke="${C.rod}" stroke-width="1.6"/>`;
  s+=jt(cx,cy,'');return s};
const rail=(x1,x2,y)=>{let s=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${C.ink}" stroke-width="1.8"/>`;
  for(let x=x1+3;x<x2;x+=10){s+=`<line x1="${x}" y1="${y+8}" x2="${x+6}" y2="${y}" stroke="${C.ht}" stroke-width="1.1"/>`}return s};
const gear=(x,y,r,n=18,label='')=>{
  let s='';
  for(let i=0;i<n;i++){const a=i*2*Math.PI/n;
    s+=`<line x1="${x+Math.cos(a)*(r-5)}" y1="${y+Math.sin(a)*(r-5)}" x2="${x+Math.cos(a)*(r+4)}" y2="${y+Math.sin(a)*(r+4)}" stroke="${C.ink}" stroke-width="2.4"/>`}
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${C.fill}" stroke="${C.ink}" stroke-width="1.5"/>`;
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${C.ht}" stroke-width="1" stroke-dasharray="5 4"/>`;
  s+=jt(x,y,label);return s};
const cam=(cx,cy,r,ax,ay)=>{
  let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.fill}" stroke="${C.ink}" stroke-width="1.6"/>`;
  s+=`<circle cx="${ax}" cy="${ay}" r="7" fill="#fff" stroke="${C.ink}" stroke-width="1.4"/>`;
  s+=`<circle cx="${ax}" cy="${ay}" r="2" fill="${C.ink}"/>`;
  s+=`<line x1="${ax}" y1="${ay}" x2="${cx}" y2="${cy}" stroke="${C.ht}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  return s};
const txt=(x,y,t,size=12,color=C.ink,anchor='start')=>`<text x="${x}" y="${y}" font-size="${size}" font-weight="600" fill="${color}" text-anchor="${anchor}">${t}</text>`;

/* 每题标准答案（8 项） */
function answersOf(p){
  return {total:p.n+1, n:p.n, red:p.red, local:p.local, k:p.k, pl:p.pl, ph:p.ph, F:3*p.n-2*p.pl-p.ph-p.local};
}
/* 允许的等价答案（如 P13 的虚约束两种数法） */
function acceptOf(p,field){
  const a=answersOf(p);
  if(p.alt&&p.alt[field]) return p.alt[field].concat([a[field]]);
  return [a[field]];
}

/* ---------- 稳定随机 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,seed){const r=mulberry32(seed);const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

const DAYS=14;
const ORDER_A=shuf(MAT,20260123);
const ORDER_B=shuf(MAT,778899);
const CATS=[...new Set(MAT.map(x=>x.c))];
const GRP={'碳素结构钢':'steel','低合金高强度结构钢':'steel','优质碳素结构钢':'steel','合金结构钢':'steel',
 '弹簧钢':'steel','碳素工具钢':'steel','合金工具钢':'steel','高速钢':'steel','滚动轴承钢':'steel','不锈钢':'steel',
 '灰铸铁':'cast','球墨铸铁':'cast','可锻铸铁':'cast',
 '黄铜':'cu','青铜':'cu','轴承合金':'cu','铸造铝合金':'al','变形铝合金':'al','纯金属':'misc'};
function grpOf(e){if(e.g==='1060')return 'al';if(e.g==='T2')return 'cu';return GRP[e.c]||'misc'}

function pickDistractors(entry,field,seed,need){
  const r=mulberry32(seed);
  const g=grpOf(entry);
  const same=MAT.filter(x=>x!==entry&&x.c===entry.c);
  const near=MAT.filter(x=>x!==entry&&x.c!==entry.c&&grpOf(x)===g);
  const other=MAT.filter(x=>grpOf(x)!==g);
  const pool=[...shuf(same,Math.floor(r()*1e6)),...shuf(near,Math.floor(r()*1e6)+13),...shuf(other,Math.floor(r()*1e6)+57)];
  const out=[];for(const p of pool){if(out.length>=need)break;if(field==='m'&&p.m===entry.m)continue;if(field==='g'&&p.g===entry.g)continue;out.push(field==='m'?p.m:p.g)}
  return out;
}
function buildQuestion(kind,entry,seed){
  const correct=kind==='A'?entry.m:entry.g;
  const ds=pickDistractors(entry,kind==='A'?'m':'g',seed,3);
  const mixed=shuf([correct,...ds],seed+7);
  return {correct,options:mixed,ci:mixed.indexOf(correct)};
}
function dayItems(day){
  const d=day-1,list=[];
  for(let i=0;i<5;i++){
    const e=ORDER_A[(d*5+i)%MAT.length];
    const q=buildQuestion('A',e,d*37+i*7);
    list.push(Object.assign({kind:'A',entry:e},q));
  }
  for(let i=0;i<5;i++){
    const e=ORDER_B[(d*5+i)%MAT.length];
    const q=buildQuestion('B',e,d*53+i*11+501);
    list.push(Object.assign({kind:'B',entry:e},q));
  }
  const r=mulberry32(day*911+13);
  for(let i=list.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=list[i];list[i]=list[j];list[j]=t}
  return list;
}

function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const WEEK=['日','一','二','三','四','五','六'];

  try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw)}catch(e){}

if(!st.wrong)st.wrong=[];

function streak(){
  const dates=[...new Set(st.checkins.map(c=>c.date))].sort();
  if(!dates.length)return 0;
  const today=new Date(todayStr());
  const gap=Math.round((today-new Date(dates[dates.length-1]))/86400000);
  if(gap>1)return 0;
  let n=1,cur=new Date(dates[dates.length-1]);
  for(let i=dates.length-2;i>=0;i--){
    const prev=new Date(dates[i]);
    if(Math.round((cur-prev)/86400000)===1){n++;cur=prev}else break;
  }
  return n;
}

  const blankHtml=BLANK_DEF.map(function(d){
    const f=d[0],label=d[1],sub=d[2];
    const val=blanks[f]!==undefined?blanks[f]:'';
    let cls='blank',mk='';
    if(checked){
      const ok=val!=='' && acceptOf(p,f).some(a=>Math.abs(parseFloat(val)-a)<1e-6);
      cls+=ok?' ok':' no';mk=ok?'正确':'有误';
    }
    return `<div class="${cls}" id="bk_${f}">
      <label for="answer_${f}">${label}${sub?`<i>${sub}</i>`:''}</label>
      <div class="r">
        <input id="answer_${f}" type="number" step="any" inputmode="decimal" data-f="${f}" value="${val}" placeholder="—" aria-invalid="${checked&&mk==='有误'}">
        <span class="mk">${mk}</span>
      </div></div>`;
  }).join('');

  let mIdx=Math.min(st.cur[st.day]||0,9);

  function oneQ(i){
    const it=items[i],chosen=st.answers[st.day+':mq:'+i],done=chosen!==undefined;
    const stem=it.kind==='A'
      ? `牌号 <span class="g">${it.entry.g}</span> 表示（　）`
      : `下列牌号中，表示「${it.entry.m}」的是（　）`;
    const opts=it.options.map((o,k)=>{
      let cls='opt',mk='';
      if(done){
        if(k===it.ci){cls+=' ok';mk='答案'}
        else if(k===chosen){cls+=' no';mk='已选'}
        else cls+=' dim';
      }
      return `<button class="${cls}" data-k="${k}" ${done?'disabled':''}><span class="lb">${'ABCD'[k]}</span><span>${o}</span><span class="mk">${mk}</span></button>`;
    }).join('');
    const fb=done?`<div class="fb on ${chosen===it.ci?'':'no'}">
        <span class="hd">${chosen===it.ci?'回答正确':'回答错误，正确答案 '+'ABCD'[it.ci]}</span>
        <span class="why">${it.entry.g}：${it.entry.m}。常用作 ${it.entry.u}。</span></div>`:'';
    return `<div class="mq" id="mqc">
      <div class="stem" tabindex="-1"><span class="txt">${stem}</span></div>
      <div class="opts">${opts}</div>${fb}</div>`;
  }

  function dotsHtml(){
    return items.map((it,i)=>{
      const a=st.answers[st.day+':mq:'+i];
      const cls='i'+(i===mIdx?' cur':'')+(a===undefined?'':(a===it.ci?' ok':' no'));
      const status=a===undefined?'未作答':a===it.ci?'正确':'错误';
      return `<button class="${cls}" data-j="${i}" aria-label="第 ${i+1} 题，${status}" ${i===mIdx?'aria-current="step"':''}>${i+1}</button>`;
    }).join('');
  }

  function mqInner(){
    const done=st.answers[st.day+':mq:'+mIdx]!==undefined;
    const cnt=items.filter((it,i)=>st.answers[st.day+':mq:'+i]!==undefined).length;
    return `<div class="tag"><h2 id="materialsTitle">材料牌号</h2><span class="cnt" id="mcount">已答 ${cnt} / 10</span></div>
    <div class="qbar" role="group" aria-label="选择题目">${dotsHtml()}</div>
    <div class="qnote">第 ${mIdx+1} / 10 题 · 点击题号可切换</div>
    ${oneQ(mIdx)}
    <div class="mnav">
      <button class="navg" id="mPrev" ${mIdx===0?'disabled':''}>上一题</button>
      <button class="navd" id="mNext" ${done&&mIdx<9?'':'disabled'}>${mIdx===9?'已是最后一题':'下一题'}</button>
    </div>
    <div class="finish">
      <button class="btn sub" id="subBtn" aria-describedby="subHint" disabled>完成今日打卡</button>
      <div class="goalline" id="subHint"></div>
    </div>`;
  }

  function paintMq(){
    mIdx=Math.min(st.cur[st.day]||0,9);
    document.getElementById('mqCard').innerHTML=mqInner();
    bindMq();
    refreshSubmit();
  }

  function pick(k){
    const key=st.day+':mq:'+mIdx;
    if(st.answers[key]!==undefined)return;
    const it=items[mIdx];
    st.answers[key]=k;
    if(k!==it.ci){
      st.wrong.push({g:it.entry.g,m:it.entry.m,u:it.entry.u,day:st.day,
        stem:it.kind==='A'?`牌号 ${it.entry.g} 表示`:`「${it.entry.m}」对应的牌号`,
        chosen:it.options[k],correct:it.kind==='A'?it.entry.m:it.entry.g});
    }
    save();
    paintMq();
    document.getElementById('status').textContent=document.querySelector('.fb').textContent;
    const next=document.getElementById('mNext');
    (next.disabled?document.querySelector('.qbar .cur'):next).focus({preventScroll:true});
  }

  function bindMq(){
    const card=document.getElementById('mqCard');
    if(!card)return;
    card.querySelectorAll('.opt').forEach(b=>{b.onclick=()=>pick(+b.dataset.k)});
    card.querySelectorAll('.qbar button').forEach(d=>{
      d.onclick=()=>{st.cur[st.day]=+d.dataset.j;save();paintMq();card.querySelector('.qbar .cur').focus({preventScroll:true})};
    });
    const pv=card.querySelector('#mPrev');
    if(pv)pv.onclick=()=>{st.cur[st.day]=Math.max(0,mIdx-1);save();paintMq();card.querySelector('.stem').focus({preventScroll:true})};
    const nx=card.querySelector('#mNext');
    if(nx)nx.onclick=()=>{
      if(st.answers[st.day+':mq:'+mIdx]===undefined)return;
      st.cur[st.day]=Math.min(9,mIdx+1);save();paintMq();
      card.querySelector('.stem').focus({preventScroll:true});
    };
    const sb=card.querySelector('#subBtn');
    if(sb)sb.onclick=submitDay;
  }

  view.innerHTML=`
  <div class="study-grid">
  <section class="card" aria-labelledby="dofTitle">
    <div class="tag"><h2 id="dofTitle">${p.name}</h2><span class="cnt">自由度 · 8 项填空</span></div>
    <div class="svgwrap"><svg viewBox="${p.vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${p.name}机构示意图">${p.svg()}</svg></div>
    <div class="qtext">${p.q}</div>
    <div class="hint">逐项填写：构件总数含机架；注意看清构件的汇交处是几处、属于哪种铰链。</div>
    <div class="blanks">${blankHtml}</div>
    <button class="btn sub" id="dofCheck">核对答案</button>
    <div class="sol" id="dofSol" aria-live="polite"></div>
  </section>

  <section class="card" id="mqCard" aria-labelledby="materialsTitle">${mqInner()}</section>
  </div>`;

  /* --- 填空 --- */
  const sol=document.getElementById('dofSol');
  view.querySelectorAll('.blank input').forEach(inp=>{
    inp.oninput=()=>{
      if(!st.blank[st.day])st.blank[st.day]={};
      st.blank[st.day][inp.dataset.f]=inp.value;
      delete st.blank[st.day+'c'];
      save();
      const box=inp.closest('.blank');
      box.className='blank';
      box.querySelector('.mk').textContent='';
      inp.setAttribute('aria-invalid','false');
      sol.classList.remove('on');
      refreshSubmit();
    };
  });

  function showSol(){
    const cur=st.blank[st.day]||{};
    const filled=BLANK_DEF.filter(d=>cur[d[0]]!==undefined&&cur[d[0]]!=='').length;
    if(!filled){view.querySelector('.blank input').focus();return}
    let right=0;
    BLANK_DEF.forEach(function(d){
      const f=d[0],el=document.getElementById('bk_'+f),v=cur[f];
      const ok=v!==undefined&&v!==''&&acceptOf(p,f).some(a=>Math.abs(parseFloat(v)-a)<1e-6);
      el.className='blank '+(ok?'ok':'no');
      el.querySelector('.mk').textContent=ok?'正确':'有误';
      el.querySelector('input').setAttribute('aria-invalid',String(!ok));
      if(ok)right++;
    });
    st.blank[st.day+'c']=1;save();
    const a=answersOf(p);
    const base=3*p.n-2*p.pl-p.ph;
    const line2=p.local
      ? `= 3×${p.n} − 2×${p.pl} − ${p.ph} = ${base}　→　${base} − ${p.local} = ${a.F}`
      : `= 3×${p.n} − 2×${p.pl} − ${p.ph} = ${a.F}${p.red?'　（已除去虚约束）':''}`;
    sol.innerHTML=`<div class="verdict ${right===8?'ok':'bad'}">填对 ${right} / 8 空 · 参考答案</div>
      <div class="formula">
        <b>构件总数 N = n + 1 = ${a.total}</b>
        <b>n = ${a.n}　虚约束 ${a.red} 处　局部自由度 ${a.local} 处　复合铰链 ${a.k} 处</b>
        <b>P_L = ${a.pl}　P_H = ${a.ph}</b>
        <b>F = 3n − 2P_L − P_H ${line2}</b>
      </div>
      <ul class="steps">${p.steps.map(s=>`<li>${s}</li>`).join('')}</ul>
      <div class="tipbox">${p.tip}</div>`;
    sol.classList.add('on');
    refreshSubmit();
  }
  document.getElementById('dofCheck').onclick=showSol;
  if(checked)showSol();

  /* --- 选择题（逐题，绑定见 bindMq） --- */

  function refreshSubmit(){
    const btn=document.getElementById('subBtn');if(!btn)return;
    const done=items.filter((it,i)=>st.answers[st.day+':mq:'+i]!==undefined).length;
    const dofDone=!!st.blank[st.day+'c'];
    btn.disabled=!(done===10&&dofDone);
    document.getElementById('subHint').textContent=(done===10&&dofDone)
      ?'两项任务均已完成，可以打卡'
      :((10-done>0?`还差 ${10-done} 道选择题`:'选择题已答完')+(dofDone?'':'　＋　还差自由度填空核对'));
  }
  refreshSubmit();

  function submitDay(){
    const right=items.filter((it,i)=>st.answers[st.day+':mq:'+i]===it.ci).length;
    const p2=DOF[st.day-1];
    const cur=st.blank[st.day]||{};
    const dofRight=BLANK_DEF.filter(function(d){
      const f=d[0],v=cur[f];
      return v!==undefined&&v!==''&&acceptOf(p2,f).some(a=>Math.abs(parseFloat(v)-a)<1e-6);
    }).length;
    st.checkins.push({day:st.day,date:todayStr(),dof:dofRight,score:right});
    const finished=st.day;
    st.day=Math.min(st.day+1,DAYS+1);
    save();
    showFinishModal(finished,right,dofRight);
  }
  bindMq();
}

function showFinishModal(day,right,dofRight){
  const mask=document.getElementById('mask'),modal=document.getElementById('modal');
  const all=day>=DAYS;
  modal.innerHTML=`
    <div class="mark">今日练习已记录</div>
    <h3 id="finishTitle">第 ${day} 天打卡完成</h3>
    <div class="score">${right}<span> / 10</span></div>
    <p>牌号题正确率 ${right*10}%　·　自由度填空填对 ${dofRight} / 8<br>
    ${all?'14 天全部完成，去错题本再巩固一轮吧。':'已记入今天的打卡，下一套已解锁，可继续加练，也可明天再来。'}</p>
    <div class="row">
      <button class="btn ghost" id="mWrong">看错题</button>
      <button class="btn sub" id="mOk">${all?'完成学习':'继续练习'}</button>
    </div>`;
  const nav=document.querySelector('nav');
  document.getElementById('app').inert=true;
  nav.inert=true;
  document.querySelector('.skip').inert=true;
  document.body.classList.add('modal-open');
  mask.inert=false;
  mask.classList.add('on');
  function close(destination='home'){
    mask.classList.remove('on');mask.inert=true;
    document.getElementById('app').inert=false;
    nav.inert=false;
    document.querySelector('.skip').inert=false;
    document.body.classList.remove('modal-open');
    switchTab(destination);
    const target=destination==='home'?document.getElementById('dofCheck'):null;
    (target||document.querySelector('nav button.on')).focus({preventScroll:true});
  }
  document.getElementById('mOk').onclick=()=>close();
  document.getElementById('mWrong').onclick=()=>close('wrong');
  mask.onclick=e=>{if(e.target===mask)close()};
  mask.onkeydown=e=>{
    if(e.key==='Escape'){e.preventDefault();close();return}
    if(e.key!=='Tab')return;
    const buttons=[...modal.querySelectorAll('button')];
    const first=buttons[0],last=buttons[buttons.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  };
  document.getElementById('mOk').focus({preventScroll:true});
}

/* ---- 错题本 ---- */
function renderWrong(){
  const list=st.wrong;
  if(!list.length){
    view.innerHTML=`<div class="empty"><h2>还没有错题</h2><p>做错的牌号题会自动收进这里，方便集中复习。</p><button class="btn ghost" id="practice">去做今日练习</button></div>`;
    document.getElementById('practice').onclick=()=>switchTab('home');
    return;
  }
  view.innerHTML=`<h2 class="sec-title">待巩固 ${list.length} 条</h2><div class="card">
    ${list.map((w,i)=>`<div class="wq">
      <button class="del" data-i="${i}">移除</button>
      <div class="s">${w.stem}</div>
      <div class="a">你的答案：${w.chosen}<br>正确：<em>${w.correct}</em><br>${w.g} 常用作 ${w.u}</div>
    </div>`).join('')}
  </div>`;
  view.querySelectorAll('.del').forEach(b=>{
    b.onclick=()=>{
      const index=+b.dataset.i;
      st.wrong.splice(index,1);save();renderWrong();
      document.getElementById('status').textContent=`已移除错题，还剩 ${st.wrong.length} 条`;
      const buttons=view.querySelectorAll('.del');
      (buttons[Math.min(index,buttons.length-1)]||document.getElementById('practice')).focus({preventScroll:true});
    };
  });
}

/* ---- 牌号速查 ---- */
let libQ='';
function renderLib(){
  view.innerHTML=`
    <div class="search-panel"><label class="search-label" for="libSearch">搜索材料</label>
      <input class="search" id="libSearch" type="search" placeholder="试试 Q235、黄铜或齿轮" autocomplete="off" aria-describedby="libCount">
      <p class="search-meta" id="libCount" role="status"></p>
    </div>
    <div id="libResults"></div>
    <p class="note">共 ${MAT.length} 个牌号，覆盖教材第二模块 2.2 钢铁材料与 2.3 非铁金属。牌号规则依据 GB/T 221《钢铁产品牌号表示方法》。</p>`;
  const inp=document.getElementById('libSearch');
  inp.value=libQ;
  function updateResults(){
    const query=libQ.trim().toLowerCase();
    const filtered=MAT.filter(x=>[x.g,x.m,x.c,x.u].some(value=>value.toLowerCase().includes(query)));
    const groups=CATS.map(c=>{
      const items=filtered.filter(x=>x.c===c);
      if(!items.length)return '';
      return `<section><h2 class="sec-title">${c} · ${items.length}</h2><div class="card">${
        items.map(x=>`<div class="lib-item"><div class="grade">${x.g}<span>${x.c}</span></div>
          <div><div class="m">${x.m}</div><div class="u">常用：${x.u}</div></div></div>`).join('')
      }</div></section>`;
    }).join('');
    document.getElementById('libResults').innerHTML=filtered.length?groups:'<div class="empty"><h2>没有匹配的牌号</h2><p>换个牌号、材料名称或用途再试试。</p></div>';
    document.getElementById('libCount').textContent=`显示 ${filtered.length} / ${MAT.length} 个牌号`;
  }
  inp.oninput=()=>{libQ=inp.value;updateResults()};
  updateResults();
}

/* ---- 我的 ---- */
function renderMe(){
  const done=st.checkins.length;
  const total=st.checkins.reduce((a,c)=>a+c.score,0);
  const avg=done?Math.round(total/(done*10)*100):0;
  const dofSum=st.checkins.reduce((a,c)=>a+c.dof,0);
  const recs=st.checkins.slice().reverse().map(c=>`<div class="rec"><span>第 ${c.day} 天 · ${c.date}</span><span class="sc">${c.score}/10　填空 ${c.dof}/8</span></div>`).join('');
  view.innerHTML=`
    <h2 class="sec-title">学习统计</h2>
    <div class="stat-grid">
      <div class="stat"><div class="v">${done}<span class="sr-only">天</span></div><div class="k">已打卡天数</div></div>
      <div class="stat"><div class="v">${avg}%</div><div class="k">牌号正确率</div></div>
      <div class="stat"><div class="v">${done?Math.round(dofSum/(done*8)*100):0}%</div><div class="k">填空正确率</div></div>
    </div>
    <h2 class="sec-title">打卡记录</h2>
    <div class="card">${recs||'<p class="note">完成今日练习后，第一条记录就会出现在这里。</p>'}</div>
    <h2 class="sec-title">题库说明</h2>
    <div class="card">
      <div class="note notes">
      <p>自由度题：14 道平面机构，黑白线稿。每题按「构件总数／活动构件数／虚约束／局部自由度／复合铰链／低副数／高副数／自由度」8 项填空；覆盖曲柄滑块、铰链四杆、五杆、摆动导杆、六杆复合、复合铰链、凸轮（滚子／平底／移动凸轮）、齿轮与齿条、平行四边形虚约束、偏心轮。</p>
      <p>牌号题：46 个牌号，两种问法各占 50%，干扰项优先取自同类、同族材料。</p>
      <p>每日题目按固定种子生成，同一设备每次打开题目不变。</p>
      </div>
    </div>
    <div class="card">
      <h2>数据管理</h2><p class="note">记录仅保存在当前浏览器，建议定期导出备份。</p>
      <div class="actions">
      <button class="btn ghost" id="exp">导出记录</button>
      <button class="btn ghost danger" id="clr">清空数据</button>
      </div>
    </div>`;
  document.getElementById('exp').onclick=()=>{
    const data={startedAt:st.startedAt,checkins:st.checkins,wrong:st.wrong};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'),url=URL.createObjectURL(blob);
    a.href=url;a.download='机械基础打卡记录.json';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  document.getElementById('clr').onclick=()=>{
    if(confirm('清空全部打卡进度、答案与错题？此操作不可恢复。')){
      st=initialState();save();render();
      document.getElementById('status').textContent='学习数据已清空，可以重新开始练习';
      document.getElementById('clr').focus({preventScroll:true});
    }
  };
}

/* ---- 切换 ---- */
function switchTab(t){
  tab=t;
  document.querySelectorAll('nav button').forEach(b=>{
    const active=b.dataset.tab===t;
    b.classList.toggle('on',active);
    if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  render();
}
function render(){
  renderHead();
  if(tab==='home')renderHome();
  else if(tab==='wrong')renderWrong();
  else if(tab==='lib')renderLib();
  else renderMe();
  view.getAnimations().forEach(animation=>animation.cancel());
  if(!reducedMotion.matches){
    view.animate([{opacity:.65,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>{b.onclick=()=>switchTab(b.dataset.tab)});
render();
</script>
