<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e9">
  <title>今天，换你载我 · 自行车骑鹈鹕</title>
  <style>
    :root { color-scheme: light; --paper: #f7f3e9; --ink: #385950; --muted: #849181; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(1260px, 100%); min-height: 100svh; margin: auto; padding: 34px 54px 28px; display: flex; flex-direction: column; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: .16em; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid #b3bfa9; border-radius: 50%; font-size: 20px; }
    .edition { font-size: 10px; letter-spacing: .18em; color: var(--muted); }
    .stage { flex: 1; display: flex; align-items: center; padding: 12px 0; }
    svg { width: 100%; height: auto; display: block; }
    footer { padding-top: 22px; border-top: 1px solid #d9dfcf; }
    h1 { margin: 0 0 9px; font-family: "Songti SC", "STSong", "SimSun", serif; font-size: clamp(24px, 3vw, 37px); font-weight: 500; letter-spacing: .08em; }
    .caption { margin: 0; font-size: 12px; line-height: 1.9; color: var(--muted); }
    button { flex-shrink: 0; padding: 12px 19px; border: 1px solid #b2c0a9; border-radius: 30px; background: transparent; color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 9px; }
    button:hover { background: #e9eddf; }
    button:focus-visible { outline: 2px solid #498f78; outline-offset: 5px; }
    .cloud { animation: drift 16s ease-in-out infinite alternate; }
    .cloud-late { animation-delay: -8s; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 6.8s infinite; }
    .ribbon { transform-origin: 614px 302px; animation: flutter 3s ease-in-out infinite; }
    .wing { transform-origin: 575px 478px; animation: wing-sway 4.8s ease-in-out infinite; }
    .paused * { animation-play-state: paused !important; }
    @keyframes drift { to { transform: translateX(25px); } }
    @keyframes blink { 0%,55%,59%,100% { transform: scaleY(1); } 57% { transform: scaleY(.1); } }
    @keyframes flutter { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(7deg); } }
    @keyframes wing-sway { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(2deg); } }
    @media (max-width: 600px) {
      main { padding: 24px 20px; }
      .brand { font-size: 10px; gap: 8px; letter-spacing: .1em; }
      .edition { font-size: 8px; letter-spacing: .06em; }
      .stage { min-height: 350px; }
      footer { flex-wrap: wrap; }
      .caption { font-size: 11px; }
      button { padding: 11px 15px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>

    <footer>
      <div><h1>今天，换你载我。</h1><p class="caption">自行车搭上鹈鹕的背，慢悠悠地去吹海风。</p></div>
      <button id="toggle" type="button" aria-label="暂停动画" aria-pressed="false"><span id="control-icon" aria-hidden="true">Ⅱ</span><span id="control-label">暂停片刻</span></button>
    </footer>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const button = document.getElementById('toggle');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const travellers = document.getElementById('travellers');
    const rearSpokes = document.getElementById('rear-spokes');
    const frontSpokes = document.getElementById('front-spokes');
    const crank = document.getElementById('crank');
    const road = document.getElementById('road');
    const nearLeg = document.getElementById('leg-near-path');
    const farLeg = document.getElementById('leg-far-path');
    const nearFoot = document.getElementById('foot-near');
    const farFoot = document.getElementById('foot-far');
    const shadow = document.getElementById('shadow');
    let paused = reducedMotion.matches;
    let elapsed = 0;
    let lastTimestamp = null;
    let frameId = null;

    function render(time) {
      const phase = time * Math.PI * 2 / 4.8;
      const bob = -Math.cos(phase * 2) * 2.5;
      const stride = Math.sin(phase) * 22;
      const nearLift = Math.max(0, Math.cos(phase)) * 13;
      const farLift = Math.max(0, -Math.cos(phase)) * 13;
      const wheelAngle = (time * 29) % 360;
      travellers.setAttribute('transform', `translate(0 ${bob}) rotate(${Math.sin(phase) * .35} 580 495)`);
      rearSpokes.setAttribute('transform', `rotate(${wheelAngle})`);
      frontSpokes.setAttribute('transform', `rotate(${wheelAngle})`);
      crank.setAttribute('transform', `rotate(${(time * 14.5) % 360} 537 398)`);
      nearFoot.setAttribute('transform', `translate(${stride} ${-nearLift - bob})`);
      farFoot.setAttribute('transform', `translate(${-stride} ${-farLift - bob})`);
      nearLeg.setAttribute('d', `M512 554Q${527 + stride * .5} 602 ${509 + stride} ${648 - nearLift - bob}`);
      farLeg.setAttribute('d', `M607 545Q${589 - stride * .5} 594 ${607 - stride} ${644 - farLift - bob}`);
      road.setAttribute('transform', `translate(${-((time * 38) % 600)} 0)`);
      shadow.setAttribute('rx', String(220 + Math.cos(phase * 2) * 3));
    }

    function animate(timestamp) {
      if (lastTimestamp !== null) elapsed += Math.min((timestamp - lastTimestamp) / 1000, .064);
      lastTimestamp = timestamp;
      render(elapsed);
      frameId = requestAnimationFrame(animate);
    }

    function updatePlayback() {
      if (frameId !== null) cancelAnimationFrame(frameId);
      frameId = null;
      lastTimestamp = null;
      scene.classList.toggle('paused', paused);
      button.setAttribute('aria-pressed', String(paused));
      button.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      document.getElementById('control-icon').textContent = paused ? '▷' : 'Ⅱ';
      document.getElementById('control-label').textContent = paused ? '继续闲游' : '暂停片刻';
      if (!paused && !document.hidden) frameId = requestAnimationFrame(animate);
    }

    button.addEventListener('click', () => { paused = !paused; updatePlayback(); });
    reducedMotion.addEventListener('change', event => { paused = event.matches; updatePlayback(); });
    document.addEventListener('visibilitychange', updatePlayback);
    render(0);
    updatePlayback();
  </script>
</body>
</html>
