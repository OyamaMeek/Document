<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ea">
  <title>慢慢骑，慢慢来 · 鹈鹕的海岸午后</title>
  <style>
    :root { color-scheme: light; --paper: #f6f3ea; --ink: #334c48; --muted: #7d8c81; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(1200px, 100%); min-height: 100svh; margin: auto; display: flex; flex-direction: column; padding: 38px 52px 24px; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .signature { display: flex; align-items: center; gap: 11px; font-size: 12px; letter-spacing: .16em; }
    .signature span:first-child { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #aab5a6; border-radius: 50%; font-size: 17px; }
    .edition { color: var(--muted); font-size: 10px; letter-spacing: .2em; }
    .illustration { flex: 1; display: flex; align-items: center; justify-content: center; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    footer { border-top: 1px solid #dce0d4; padding-top: 20px; }
    h1 { margin: 0 0 8px; font-family: "Songti SC", "STSong", "SimSun", serif; font-size: clamp(24px, 3.4vw, 36px); font-weight: 500; letter-spacing: .12em; }
    .caption { margin: 0; font-size: 12px; letter-spacing: .08em; color: var(--muted); line-height: 1.8; }
    button { color: var(--ink); background: transparent; border: 1px solid #bcc6b8; border-radius: 30px; padding: 12px 19px; font: inherit; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
    button:hover { background: #e9eee3; }
    button:focus-visible { outline: 2px solid #438478; outline-offset: 5px; }
    .control-icon { font-size: 12px; letter-spacing: 1px; }
    .cloud { animation: cloud-drift 12s ease-in-out infinite alternate; }
    .cloud-late { animation-delay: -7s; }
    .scarf-end { transform-origin: 597px 287px; animation: scarf-wave 2.3s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 7s infinite; }
    .bird { animation: bird-drift 6s ease-in-out infinite alternate; }
    .paused * { animation-play-state: paused !important; }
    @keyframes cloud-drift { to { transform: translateX(18px); } }
    @keyframes scarf-wave { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(6deg); } }
    @keyframes blink { 0%,42%,46%,100% { transform: scaleY(1); } 44% { transform: scaleY(.08); } }
    @keyframes bird-drift { to { transform: translate(-22px, 5px); } }
    @media (max-width: 600px) {
      main { padding: 24px 22px; }
      .edition { font-size: 8px; letter-spacing: .1em; }
      .signature { font-size: 10px; }
      .illustration { min-height: 360px; }
      svg { width: calc(100% + 30px); flex-shrink: 0; }
      footer { gap: 12px; align-items: flex-end; }
      .caption { max-width: 210px; font-size: 11px; letter-spacing: 0; }
      button { padding: 11px 13px; font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>

        <g fill="#faf6e5"><circle cx="985" cy="516" r="8"/><circle cx="996" cy="560" r="6"/></g>
        <g fill="#d8b05f"><circle cx="985" cy="516" r="3"/><circle cx="996" cy="560" r="2"/></g>

            <circle r="86" fill="#f6f3ea" stroke="#3d514d" stroke-width="10"/>

    </div>
    <footer>
      <div><h1>慢慢骑，慢慢来。</h1><p class="caption">海风刚好，今天也没有什么需要着急的事。</p></div>
      <button id="toggle" type="button" aria-label="暂停动画" aria-pressed="false"><span class="control-icon" aria-hidden="true">Ⅱ</span><span id="toggle-label">暂停片刻</span></button>
    </footer>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const button = document.getElementById('toggle');
    const label = document.getElementById('toggle-label');
    const icon = button.querySelector('.control-icon');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const rearSpokes = document.getElementById('rear-spokes');
    const frontSpokes = document.getElementById('front-spokes');
    const road = document.getElementById('road');
    const rider = document.getElementById('rider');
    const crank = document.getElementById('crank');
    let paused = reducedMotion.matches;
    let elapsed = 0;
    let lastTimestamp = null;
    let frameId = null;

    function drawLeg(side, hip, foot, upper, lower, bend) {
      const dx = foot.x - hip.x;
      const dy = foot.y - hip.y;
      const distance = Math.hypot(dx, dy);
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const across = Math.sqrt(Math.max(0, upper * upper - along * along));
      const kneeX = hip.x + along * dx / distance - bend * across * dy / distance;
      const kneeY = hip.y + along * dy / distance + bend * across * dx / distance;
      document.getElementById(`${side}-leg-path`).setAttribute('d', `M${hip.x} ${hip.y}L${kneeX} ${kneeY}L${foot.x} ${foot.y}`);
      document.getElementById(`${side}-foot`).setAttribute('d', `M${foot.x - 5} ${foot.y - 2}Q${foot.x + 9} ${foot.y - 5} ${foot.x + 23} ${foot.y + 1}`);
      if (side === 'near') document.getElementById('toe-line').setAttribute('d', `M${foot.x + 10} ${foot.y + 2}h13`);
    }

    function render(time) {
      const angle = time * Math.PI * 2 / 3.8;
      const degrees = angle * 180 / Math.PI;
      const bob = Math.sin(angle * 2) * 2;
      rearSpokes.setAttribute('transform', `rotate(${degrees * 1.6})`);
      frontSpokes.setAttribute('transform', `rotate(${degrees * 1.6})`);
      road.setAttribute('transform', `translate(${-((angle * 1.6 * 86) % 600)} 0)`);
      rider.setAttribute('transform', `translate(0 ${bob})`);
      const near = { x: 578 + Math.cos(angle) * 26, y: 555 + Math.sin(angle) * 26 };
      const far = { x: 578 - Math.cos(angle) * 26, y: 555 - Math.sin(angle) * 26 };
      crank.querySelector('path').setAttribute('d', `M${far.x} ${far.y}L${near.x} ${near.y}`);
      document.getElementById('pedal-near').setAttribute('d', `M${near.x - 9} ${near.y + 7}h31`);
      document.getElementById('pedal-far').setAttribute('d', `M${far.x - 9} ${far.y + 7}h31`);
      drawLeg('far', { x: 537, y: 421 + bob }, far, 90, 95, 1);
      drawLeg('near', { x: 561, y: 426 + bob }, near, 84, 93, -1);
    }

    function animate(timestamp) {
      if (lastTimestamp !== null) elapsed += Math.min((timestamp - lastTimestamp) / 1000, .064);
      lastTimestamp = timestamp;
      render(elapsed);
      frameId = requestAnimationFrame(animate);
    }

    function updatePlayback() {
      if (frameId !== null) cancelAnimationFrame(frameId);
      frameId = null;
      lastTimestamp = null;
      scene.classList.toggle('paused', paused);
      button.setAttribute('aria-pressed', String(paused));
      button.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      label.textContent = paused ? '继续闲游' : '暂停片刻';
      icon.textContent = paused ? '▷' : 'Ⅱ';
      if (!paused && !document.hidden) frameId = requestAnimationFrame(animate);
    }

    button.addEventListener('click', () => { paused = !paused; updatePlayback(); });
    reducedMotion.addEventListener('change', (event) => { paused = event.matches; updatePlayback(); });
    document.addEventListener('visibilitychange', updatePlayback);
    render(0);
    updatePlayback();
  </script>
</body>
</html>
