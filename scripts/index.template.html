<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Document · 文件空间</title>
  <style>
    :root { font: 100%/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; --canvas: #f5f5f7; --surface: #fff; --glass: rgba(245, 246, 249, .82); --chrome: rgba(255, 255, 255, .88); --text: #24252a; --muted: #70737c; --line: #e9eaf0; --blue: #007aff; --selected: #e7f0ff; --hover: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: radial-gradient(ellipse at 10% 0%, #e8edf7, transparent 60%), var(--canvas); }
    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button, a { touch-action: manipulation; }
    button { cursor: pointer; color: inherit; }
    button:disabled { cursor: default; opacity: .35; }
    button:active:not(:disabled), .file-row:active { background: var(--selected); }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    .drive { display: grid; grid-template-columns: 15rem minmax(0, 1fr); max-width: 80rem; min-height: calc(100svh - 4rem); margin: 2rem auto; border: 1px solid rgba(150, 160, 180, .16); border-radius: 1.4rem; background: var(--surface); box-shadow: 0 1.5rem 5rem -2rem rgba(35, 50, 80, .18), 0 .25rem 1rem rgba(35, 50, 80, .03); }
    .sidebar { display: flex; flex-direction: column; padding: 1.9rem 1rem 1.25rem; border-radius: 1.4rem 0 0 1.4rem; background: var(--glass); backdrop-filter: blur(28px) saturate(140%); }
    .brand { display: flex; gap: .75rem; align-items: center; padding: 0 .6rem 2.25rem; }
    .brand-mark { display: grid; place-items: center; width: 2.6rem; height: 2.6rem; border-radius: .8rem; color: white; background: linear-gradient(145deg, #5ba8ff, #007aff); box-shadow: 0 .3rem .8rem #007aff26; }
    .brand-mark svg { width: 1.65rem; height: 1.65rem; }
    .brand strong { font-size: 1.05rem; letter-spacing: -.025em; }
    .brand small { display: block; margin-top: .1rem; color: var(--muted); font-size: .72rem; letter-spacing: .04em; }
    .sidebar-label { margin: 1.65rem .7rem .55rem; color: var(--muted); font-size: .7rem; font-weight: 600; letter-spacing: .07em; }
    .nav-button { display: flex; align-items: center; gap: .65rem; width: 100%; min-height: 2.75rem; padding: .65rem .75rem; border: 0; border-radius: .65rem; background: transparent; text-align: left; font-size: .83rem; font-weight: 500; }
    .nav-button svg { flex: none; width: 1.15rem; height: 1.15rem; color: var(--blue); }
    .nav-button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-button:hover { background: var(--hover); }
    .nav-button[aria-current="page"] { color: var(--blue); background: var(--selected); font-weight: 600; }
    .nav-button .nav-count { margin-left: auto; color: var(--muted); font-size: .72rem; }
    .sidebar-footer { margin-top: auto; padding: 3rem .75rem 0; color: var(--muted); font-size: .75rem; }
    .sidebar-footer strong { display: block; margin-bottom: .25rem; color: var(--text); font-weight: 500; }
    .main { min-width: 0; }
    .topbar { display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 1; min-height: 5rem; padding: 1rem 2rem; border-radius: 0 1.4rem 0 0; background: var(--chrome); backdrop-filter: blur(20px); }
    .topbar::after { content: ""; position: absolute; height: .7rem; bottom: -.7rem; left: 0; right: 0; background: linear-gradient(var(--chrome), transparent); pointer-events: none; }
    .icon-button { display: grid; place-items: center; flex: none; width: 2rem; height: 2rem; border: 0; border-radius: .55rem; background: transparent; }
    .icon-button:hover:not(:disabled) { background: var(--hover); }
    .icon-button svg { width: 1.15rem; height: 1.15rem; }
    .breadcrumbs { display: flex; align-items: center; gap: .3rem; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .breadcrumbs button { flex: none; padding: .3rem .2rem; border: 0; border-radius: .3rem; background: transparent; color: var(--muted); font-size: .78rem; }
    .breadcrumbs button[aria-current="page"] { color: var(--text); font-weight: 600; }
    .breadcrumbs svg { width: .7rem; height: .7rem; color: var(--muted); flex: none; }
    .search { display: flex; align-items: center; gap: .5rem; width: 15rem; max-width: 100%; min-height: 2.2rem; padding: .2rem .65rem; border: 1px solid var(--line); border-radius: .65rem; background: var(--hover); }
    .search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px #007aff15; }
    .search > svg { width: 1rem; height: 1rem; color: var(--muted); flex: none; }
    .search input { min-width: 0; width: 100%; padding: .2rem 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: .78rem; }
    .search input::-webkit-search-cancel-button { display: none; }
    .search .icon-button { width: 1.35rem; height: 1.35rem; color: var(--muted); }
    .content { padding: 1.7rem 2rem 2rem; }
    .content-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.8rem; }
    h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2rem); line-height: 1.2; letter-spacing: -.045em; font-weight: 650; overflow-wrap: anywhere; }
    h1:focus { outline: none; }
    .item-count { color: var(--muted); font-size: .75rem; flex: none; }
    .list-heading, .file-row { display: grid; grid-template-columns: minmax(0, 1fr) 7.5rem 5.5rem; align-items: center; gap: 1rem; }
    .list-heading { margin-bottom: .55rem; padding: .55rem 1rem; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .7rem; letter-spacing: .035em; }
    .list-heading span:last-child, .row-size { text-align: right; }
    ul { list-style: none; padding: 0; margin: 0; }
    #file-tree ul ul { margin-left: 1.2rem; padding-left: .4rem; border-left: 1px solid var(--line); }
    #file-tree summary { cursor: pointer; }
    #file-tree summary::marker { content: ""; }
    .file-row { width: 100%; min-height: 4.05rem; padding: .7rem 1rem; border: 0; border-radius: .65rem; color: var(--text); background: transparent; text-decoration: none; text-align: left; }
    .file-row:hover { background: var(--hover); }
    .row-name { display: flex; align-items: center; gap: .85rem; min-width: 0; }
    .file-icon { display: grid; place-items: center; width: 2.25rem; height: 2.5rem; flex: none; color: #8c96a8; }
    .file-icon svg { width: 100%; height: 100%; }
    .icon-folder { color: #56aaff; }
    .icon-pdf { color: #e87070; }
    .icon-sheet { color: #55ac86; }
    .icon-book { color: #aa8cdb; }
    .icon-web { color: #e4a15c; }
    .icon-code { color: #8196d7; }
    .icon-text { color: #72a4b8; }
    .icon-image { color: #ba90bd; }
    .icon-archive { color: #b6a082; }
    .name-group { min-width: 0; }
    .filename { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .84rem; font-weight: 500; }
    .file-parent { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: .1rem; font-size: .7rem; color: var(--muted); }
    .row-type, .row-size { color: var(--muted); font-size: .74rem; }
    .row-size { font-variant-numeric: tabular-nums; }
    .file-menu { position: fixed; z-index: 10; width: min(18rem, calc(100vw - 1rem)); padding: .4rem; border: 1px solid var(--line); border-radius: .75rem; background: var(--chrome); backdrop-filter: blur(20px); box-shadow: 0 .5rem 2rem #0002; }
    .file-menu button { width: 100%; min-height: 2.5rem; padding: .5rem .75rem; border: 0; border-radius: .45rem; text-align: left; color: var(--text); background: transparent; font-size: .84rem; }
    .file-menu button:hover, .file-menu button:focus-visible { color: var(--blue); background: var(--selected); }
    .file-menu input { width: 100%; padding: .5rem; border: 1px solid var(--line); border-radius: .4rem; background: var(--surface); color: var(--text); font-size: .75rem; }
    .copy-status { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 11; max-width: calc(100vw - 2rem); padding: .65rem 1rem; border-radius: .7rem; background: var(--text); color: var(--surface); font-size: .8rem; }
    .copy-status:empty { display: none; }
    .empty-state { padding: 4rem 1rem; text-align: center; color: var(--muted); }
    .empty-state svg { display: block; width: 3rem; height: 3rem; margin: 0 auto 1rem; color: #a3afc2; }
    .empty-state strong { color: var(--text); font-size: 1rem; font-weight: 500; }
    .empty-state p { margin: .5rem 0 0; font-size: .82rem; }
    .interactive { display: none; }
    .enhanced .interactive { display: flex; }
    .enhanced #file-tree { display: none; }
    noscript p { color: var(--muted); font-size: .8rem; }
    @media (max-width: 84rem) { .drive { margin: 1.5rem; min-height: calc(100svh - 3rem); } }
    @media (max-width: 48rem) {
      .drive { display: block; margin: .6rem; min-height: calc(100svh - 1.2rem); border-radius: 1rem; }
      .sidebar { flex-direction: row; align-items: center; gap: 1rem; padding: .9rem 1rem; border-radius: 1rem 1rem 0 0; }
      .brand { padding: 0; }
      .brand-mark { width: 2.15rem; height: 2.15rem; }
      .sidebar-label, .sidebar-folders, .sidebar-footer { display: none; }
      .side-navigation { margin-left: auto; }
      .nav-button { width: auto; gap: .4rem; padding: .55rem; }
      .nav-count { display: none; }
      .topbar { flex-wrap: wrap; gap: .55rem; padding: .8rem 1rem; border-radius: 0; }
      .search { width: 100%; }
      .content { padding: 1.25rem .6rem; }
      .content-heading { padding: 0 .6rem; margin-bottom: 1.4rem; }
      .file-row, .list-heading { grid-template-columns: minmax(0, 1fr) 4.5rem; gap: .6rem; padding-left: .6rem; padding-right: .6rem; }
      .row-type, .list-heading span:nth-child(2) { display: none; }
      .filename { font-size: .8rem; }
      .row-name { gap: .65rem; }
    }
    @media (prefers-color-scheme: dark) { :root { --canvas: #181a20; --surface: #24262d; --glass: rgba(30, 32, 40, .92); --chrome: rgba(36, 38, 45, .92); --text: #f1f2f5; --muted: #a0a5b0; --line: #373a44; --blue: #68acff; --selected: #283b56; --hover: #2c2f38; } body { background: var(--canvas); } }
    @media (prefers-reduced-motion: no-preference) { .nav-button, .file-row, .icon-button { transition: background-color 100ms ease-out; } }
    @media (prefers-reduced-transparency: reduce) { .sidebar, .topbar, .file-menu { background: var(--surface); backdrop-filter: none; } }
    @media (prefers-contrast: more) { :root { --muted: #51545d; --line: #70737c; } .sidebar, .topbar { background: var(--surface); backdrop-filter: none; } .search, .nav-button[aria-current="page"] { border: 1px solid currentColor; } }
    @media (prefers-contrast: more) and (prefers-color-scheme: dark) { :root { --muted: #d2d6df; --line: #a0a5b0; } }
  </style>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-folder" viewBox="0 0 32 32"><path fill="currentColor" d="M3 8a3 3 0 0 1 3-3h7l3 4h10a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3Z"/><path fill="#fff" opacity=".22" d="M3 12h26v3H3Z"/></symbol>
    <symbol id="icon-file" viewBox="0 0 32 32"><path fill="currentColor" opacity=".14" d="M7 2h12l7 7v21H7Z"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M7 2h12l7 7v21H7ZM19 2v7h7M12 16h9M12 21h9"/></symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M7 18a5 5 0 1 1 .6-10A6 6 0 0 1 19 10a4 4 0 0 1 0 8ZM12 10v8m-3-3 3 3 3-3"/></symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </svg>
  <div class="drive">
    <aside class="sidebar" aria-label="文件空间导航">
      <div class="brand"><span class="brand-mark"><svg aria-hidden="true"><use href="#icon-cloud"></use></svg></span><div><strong>Document</strong><small>文件空间</small></div></div>
      <nav class="side-navigation interactive" aria-label="文件分类">
        <button class="nav-button" data-directory=""><svg aria-hidden="true"><use href="#icon-grid"></use></svg><span>全部文件</span><span class="nav-count"><!-- FILE_COUNT --></span></button>
      </nav>
      <div class="sidebar-label">文件夹</div>
      <nav id="sidebar-folders" class="sidebar-folders" aria-label="目录快捷导航"><button id="root-folder" class="nav-button" data-directory="" data-root><svg aria-hidden="true"><use href="#icon-folder"></use></svg><span>root</span></button></nav>
      <div class="sidebar-footer"><strong>随时找到需要的文件</strong><!-- FILE_COUNT --> 个文件，按目录有序收纳</div>
    </aside>
    <main class="main">
      <header class="topbar interactive">
        <button id="folder-up" class="icon-button" aria-label="返回上级目录" title="返回上级目录"><svg aria-hidden="true"><use href="#icon-back"></use></svg></button>
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前位置"></nav>
        <div class="search"><svg aria-hidden="true"><use href="#icon-search"></use></svg><input id="file-search" type="search" placeholder="搜索文件或文件夹" aria-label="搜索全部文件和文件夹" autocomplete="off"><button id="clear-search" class="icon-button" aria-label="清除搜索" hidden><svg aria-hidden="true"><use href="#icon-close"></use></svg></button></div>
      </header>
      <section class="content" aria-labelledby="folder-title">
        <div class="content-heading"><h1 id="folder-title" tabindex="-1">全部文件</h1><span id="visible-count" class="item-count" role="status" aria-live="polite"><!-- FILE_COUNT --> 个文件</span></div>
        <div class="list-heading" aria-hidden="true"><span>名称</span><span>类型</span><span>大小</span></div>
        <ul id="file-list" aria-label="当前目录内容" hidden></ul>
        <div id="empty-state" class="empty-state" role="status" hidden><svg aria-hidden="true"><use href="#icon-search"></use></svg><strong id="empty-title"></strong><p id="empty-description"></p></div>
        <nav id="file-tree" aria-label="完整文件目录"><!-- FILE_TREE --></nav>
        <noscript><p>可以展开文件夹并打开文件。启用 JavaScript 后可使用目录导航和搜索。</p></noscript>
      </section>
    </main>
  </div>
  <template id="root-entry"><span class="row-name"><span class="file-icon icon-folder" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#icon-folder"></use></svg></span><span class="name-group"><span class="filename">root</span></span></span><span class="row-type">文件夹</span><span class="row-size"></span></template>
  <div id="file-menu" class="file-menu" role="menu" aria-label="文件操作" hidden><button id="copy-link" type="button" role="menuitem">复制直链</button><input id="manual-link" type="text" aria-label="文件直链，按复制快捷键手动复制" readonly hidden></div>
  <div id="copy-status" class="copy-status" role="status" aria-live="polite"></div>
  <script type="module">
    const source = document.querySelector("#file-tree");
    const entries = [...source.querySelectorAll("li[data-path]")].map(row => {
      const path = row.dataset.path;
      const slash = path.lastIndexOf("/");
      return { ...row.dataset, name: path.slice(slash + 1), parent: path.slice(0, Math.max(0, slash)), action: row.querySelector(row.dataset.kind === "folder" ? "summary" : "a") };
    });
    const folders = entries.filter(entry => entry.kind === "folder");
    const search = document.querySelector("#file-search");
    const list = document.querySelector("#file-list");
    const title = document.querySelector("#folder-title");
    const breadcrumbs = document.querySelector("#breadcrumbs");
    const up = document.querySelector("#folder-up");
    const clear = document.querySelector("#clear-search");
    const empty = document.querySelector("#empty-state");
    const sidebar = document.querySelector("#sidebar-folders");
    const rootFiles = entries.filter(entry => entry.kind === "file" && entry.parent === "");
    const rootEntry = { kind: "folder", name: "root", path: "", root: true, action: document.querySelector("#root-entry").content };
    rootEntry.action.querySelector(".row-size").textContent = `${rootFiles.length} 项`;
    const menu = document.querySelector("#file-menu");
    const copy = document.querySelector("#copy-link");
    const manual = document.querySelector("#manual-link");
    const status = document.querySelector("#copy-status");
    let menuFile;
    let statusTimer;

    function icon(name) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      const use = document.createElementNS(svg.namespaceURI, "use");
      svg.setAttribute("aria-hidden", "true");
      use.setAttribute("href", `#icon-${name}`);
      svg.append(use);
      return svg;
    }

    function directoryButton(name, path, className) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.dataset.directory = path;
      const label = document.createElement("span");
      label.textContent = name;
      button.append(label);
      return button;
    }

    for (const folder of folders.filter(entry => entry.parent === "")) {
      const button = directoryButton(folder.name, folder.path, "nav-button");
      button.title = folder.name;
      button.prepend(icon("folder"));
      sidebar.append(button);
    }

    function currentDirectory() {
      return new URLSearchParams(location.hash.slice(1)).get("dir") || "";
    }

    function navigate(path, root = false) {
      search.value = "";
      const hash = root ? "#view=root" : path ? `#${new URLSearchParams({ dir: path })}` : "";
      if (location.hash === hash) render();
      else location.hash = hash;
    }

    function formatSize(size) {
      if (size === "") return "—";
      const bytes = Number(size);
      const unit = bytes > 0 ? Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), 3) : 0;
      return `${new Intl.NumberFormat("zh-CN", { maximumFractionDigits: unit ? 1 : 0 }).format(bytes / 1024 ** unit)} ${["B", "KB", "MB", "GB"][unit]}`;
    }

    function render() {
      closeMenu();
      const directory = currentDirectory();
      const root = new URLSearchParams(location.hash.slice(1)).get("view") === "root";
      const query = search.value.trim().toLocaleLowerCase();
      const exists = directory === "" || folders.some(folder => folder.path === directory);
      const visible = !exists ? [] : query ? entries.filter(entry => entry.path.toLocaleLowerCase().includes(query)) : root ? [...rootFiles] : directory ? entries.filter(entry => entry.parent === directory) : [...folders.filter(entry => entry.parent === ""), rootEntry];
      visible.sort((a, b) => Number(a.kind !== "folder") - Number(b.kind !== "folder") || a.name.localeCompare(b.name, "zh-CN", { numeric: true }));
      title.textContent = !exists ? "目录不存在" : query ? "搜索结果" : root ? "root" : directory.split("/").pop() || "全部文件";
      document.title = `${title.textContent} · Document`;
      document.querySelector("#visible-count").textContent = `${visible.length} 个项目`;
      clear.hidden = !search.value;
      up.disabled = !directory && !root && !query;
      breadcrumbs.replaceChildren(directoryButton("全部文件", "", ""));
      if (root) {
        const button = directoryButton("root", "", "");
        button.dataset.root = "";
        breadcrumbs.append(icon("chevron"), button);
      }
      let path = "";
      if (exists && directory) {
        for (const part of directory.split("/")) {
          path += (path ? "/" : "") + part;
          breadcrumbs.append(icon("chevron"), directoryButton(part, path, ""));
        }
      }
      breadcrumbs.lastElementChild.setAttribute("aria-current", "page");
      for (const button of sidebar.parentElement.querySelectorAll("button[data-directory]")) {
        if (button.dataset.directory === directory && button.hasAttribute("data-root") === root && !query) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      }
      const fragment = document.createDocumentFragment();
      for (const entry of visible) {
        const row = document.createElement("li");
        let action;
        if (entry.kind === "folder") {
          action = directoryButton("", entry.path, "file-row");
          action.replaceChildren(...[...entry.action.childNodes].map(node => node.cloneNode(true)));
          if (entry.root) action.dataset.root = "";
          action.setAttribute("aria-label", `打开文件夹 ${entry.name}`);
        } else {
          action = entry.action.cloneNode(true);
          action.querySelector(".row-size").textContent = formatSize(entry.size);
          action.setAttribute("aria-label", `打开文件 ${entry.name}`);
        }
        if (query) {
          const parent = document.createElement("span");
          parent.className = "file-parent";
          parent.textContent = entry.parent || "root";
          action.querySelector(".name-group").append(parent);
        }
        row.append(action);
        fragment.append(row);
      }
      list.replaceChildren(fragment);
      list.hidden = false;
      empty.hidden = visible.length !== 0;
      document.querySelector("#empty-title").textContent = !exists ? "找不到这个文件夹" : query ? "没有找到匹配的文件" : "这里还没有文件";
      document.querySelector("#empty-description").textContent = !exists ? "点击全部文件，返回文件空间。" : query ? "试试其他文件名或目录名称。" : "可以从侧栏浏览其他文件夹。";
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("button[data-directory]");
      if (button) navigate(button.dataset.directory, button.hasAttribute("data-root"));
    });
    function closeMenu(restoreFocus = false) {
      if (menu.hidden) return;
      menu.hidden = true;
      if (restoreFocus) menuFile?.focus({ preventScroll: true });
    }

    function openMenu(file, x, y) {
      menuFile = file;
      manual.hidden = true;
      manual.value = file.dataset.directUrl;
      menu.hidden = false;
      menu.style.left = `${Math.max(8, Math.min(x, innerWidth - menu.offsetWidth - 8))}px`;
      menu.style.top = `${Math.max(8, Math.min(y, innerHeight - menu.offsetHeight - 8))}px`;
      copy.focus({ preventScroll: true });
    }

    document.addEventListener("contextmenu", event => {
      const file = event.target.closest("a[data-direct-url]");
      if (!file) { closeMenu(); return; }
      event.preventDefault();
      const rect = file.getBoundingClientRect();
      openMenu(file, event.clientX || rect.left, event.clientY || rect.bottom);
    });
    document.addEventListener("keydown", event => {
      const file = event.target.closest("a[data-direct-url]");
      if (file && (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10"))) {
        event.preventDefault();
        const rect = file.getBoundingClientRect();
        openMenu(file, rect.left, rect.bottom);
      } else if (!menu.hidden && event.key === "Escape") {
        event.preventDefault();
        closeMenu(true);
      } else if (!menu.hidden && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
        event.preventDefault();
        copy.focus();
      } else if (!menu.hidden && event.key === "Tab") closeMenu();
    });
    document.addEventListener("pointerdown", event => { if (!menu.contains(event.target)) closeMenu(); });
    window.addEventListener("resize", () => closeMenu());
    window.addEventListener("scroll", event => { if (event.target !== manual) closeMenu(); }, true);
    copy.addEventListener("click", async () => {
      const url = manual.value;
      clearTimeout(statusTimer);
      try {
        await navigator.clipboard.writeText(url);
        closeMenu(true);
        status.textContent = "直链已复制";
      } catch {
        status.textContent = "无法自动复制，请复制菜单中的链接";
        manual.hidden = false;
        menu.style.top = `${Math.max(8, Math.min(parseFloat(menu.style.top), innerHeight - menu.offsetHeight - 8))}px`;
        manual.focus({ preventScroll: true });
        manual.select();
      }
      statusTimer = setTimeout(() => { status.textContent = ""; }, 4000);
    });
    search.addEventListener("input", render);
    clear.addEventListener("click", () => { search.value = ""; render(); search.focus(); });
    search.addEventListener("keydown", event => {
      if (event.key === "Escape") { search.value = ""; render(); }
    });
    up.addEventListener("click", () => {
      if (search.value.trim()) { search.value = ""; render(); }
      else navigate(currentDirectory().split("/").slice(0, -1).join("/"));
    });
    window.addEventListener("hashchange", () => { render(); title.focus({ preventScroll: true }); });
    render();
    document.body.classList.add("enhanced");
  </script>
</body>
</html>
